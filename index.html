r));gap:18px 22px;margin-top:18px}form .grid>div:has(textarea){grid-column:1/-1}form p{border-top:1px solid var(--line);padding-top:18px;margin-bottom:0}.scroll{margin-top:16px;border:1px solid var(--line);border-radius:10px}table{font-size:14px}th{background:#edf5f3;color:#365e60;font-weight:700;white-space:nowrap}td,th{padding:12px 14px;border-bottom:1px solid #e4eceb}tbody tr:nth-child(even){background:#f8fbfa}tbody tr:hover{background:#eef6f3}td:last-child{min-width:150px}td button{font-size:13px;padding:6px 9px}td button+button{color:#a34b4b;background:#fff5f4;border-color:#f0d9d6}#q{max-width:440px}.warn{background:#fff8e9;border:1px solid #f0e1bc;color:#80632e;font-size:14px;padding:12px 16px}.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(205px,100%),1fr));gap:15px;margin-top:20px}.metric{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:0 3px 10px #244d5508;color:var(--ink)}.metric:hover{background:#f0f8f5;border-color:#8abbb0}.metric strong{font-size:32px;color:#246b68;line-height:1.2}.metric .navicon{background:#e4f1ed;color:#246b68;border-radius:10px;width:38px;height:38px;display:grid;place-items:center;font-size:20px}.metric small{font-weight:400}.intro{color:var(--muted);margin:0 0 16px}.empty{text-align:center;color:var(--muted);padding:30px!important}.listhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.listhead h2{margin:0}.listhead button{font-size:14px} @media(max-width:760px){header{padding:10px 12px}header h1{font-size:15px}header h1:before{width:29px;height:29px;margin-right:6px;font-size:12px}main{padding:15px}section{padding:17px}nav{padding:10px 14px}.dashboard{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{padding:13px}h2{font-size:20px}} @media print{header,nav,button,form,#q,.warn{display:none!important}.layout{display:block}main{padding:0}section{box-shadow: </style><header><button id="menuToggle" aria-label="開關功能選單" aria-expanded="false" onclick="toggleMenu()">☰ 選單</button><h1>RT-LMS 呼吸治療臨床教學管理</h1><div class="account">單機測試版 · 模擬角色 <select id="role"><option>管理員</option><option>教師</option><option>學生</option></select></div></header><div class="layout"><nav id="nav" aria-label="功能選單"></nav><main id="main"></main></div><script>
const schemas={人員管理:['姓名','學號或員工編號','Google Email','角色|學生,教師,管理員','審核|待審核,通過,停用'],梯次管理:['梯次名稱','學年度','開始日期:date','結束日期:date','負責教師','學生名單','狀態|進行中,待審核,已鎖定'],教學教材:['教材名稱','分類','範圍|共用,梯次專屬','梯次','網址','內容:textarea','附件:file','狀態|開放,隱藏'],作業範本:['名稱','說明:textarea','評分標準:textarea'],作業管理:['作業名稱','梯次','截止日期:date','學生','版本:number','作業內容:textarea','附件:file','狀態|未繳交,已繳交,退回修正,已完成','教師評語:textarea','成績:number'],DOPS:['梯次','學生','教師','技術名稱','考核日期:date','操作前準備|未觀察,未達標,達標,優良','操作正確性|未觀察,未達標,達標,優良','感染控制|未觀察,未達標,達標,優良','病人安全|未觀察,未達標,達標,優良','結果|待複評,通過','教師回饋:textarea'], 'Mini-CEX':['梯次','學生','教師','臨床情境','考核日期:date',...['資料收集','照護評估','臨床推理','照護決策','溝通','專業態度','整體能力'].map(x=>x+'|NA,1,2,3,4,5,6,7,8,9'),'教師回饋:textarea'],EPA:['梯次','學生','教師','專業活動','考核日期:date','信賴等級|1,2,3,4,5','判斷依據:textarea','學習目標:textarea'],成績管理:['梯次','學生','作業分數:number','作業權重:number','技術分數:number','技術權重:number','整體分數:number','整體權重:number','審核|待審核,通過'],雙向回饋:['梯次','類型|學生對教師,學生對梯次,教師對學生,教師對梯次','對象','評分|1,2,3,4,5','回饋內容:textarea'],回饋開放:['梯次','類型|個別教師,整體梯次','指定教師','狀態|開放,關閉'],教學檢討會議:['梯次','會議日期:date','主持人','紀錄者','出席人員','討論事項:textarea','改善措施:textarea','追蹤日期:date','附件:file'],解鎖申請:['梯次','申請人','原因:textarea','審核|待審核,核准,拒絕']};let db={};try{db=JSON.parse(localStorage.getItem('rtlms-v1')||'{}')}catch(e){}let page='首頁',editing=-1;const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('rtlms-v1',JSON.stringify(db));return true}catch(e){alert('本機容量不足，請先備份並減少附件');return false}}function rows(p){return db[p]||[]}function field(s){let [n,opts]=s.split('|');let [name,t]=n.split(':');return {name,t:t||'text',opts:opts?.split(',')}}function locked(r){return r&&rows('梯次管理').some(x=>x['梯次名稱']===(r['梯次']||r['梯次名稱'])&&x['狀態']==='已鎖定')}function toggleMenu(){let open=$('nav').classList.toggle('open');$('menuToggle').setAttribute('aria-expanded',String(open))}function go(p){page=p;editing=-1;$('nav').classList.remove('open');$('menuToggle').setAttribute('aria-expanded','false');render()}const icons={'首頁':'⌂','人員管理':'♙','梯次管理':'▦','教學教材':'▤','作業範本':'▧','作業管理':'✓','DOPS':'⊞','Mini-CEX':'✚','EPA':'◎','成績管理':'▥','雙向回饋':'☏','回饋開放':'◉','教學檢討會議':'▣','解鎖申請':'◇','系統設定':'⚙'};function render(){ $('nav').innerHTML=[['總覽','首頁'],['教學管理','人員管理','梯次管理','教學教材','作業範本','作業管理'],['臨床考核','DOPS','Mini-CEX','EPA','成績管理'],['教學品質','雙向回饋','回饋開放','教學檢討會議'],['系統管理','解鎖申請','系統設定']].map(([g,...ps])=>`<div class="group">${g}</div>`+ps.map(p=>`<button class="${p===page?'active':''}" onclick="go('${p}')"><span class="navicon" aria-hidden="true">${icons[p]||'·'}</span>${p}</button>`).join('')).join('');if(page==='首頁'){ $('main').innerHTML='<section><h2>教學總覽</h2><p class="intro">臨床教學、學習歷程與品質管理，一站式工作空間。</p><p class="warn">僅供測試：本機資料未加密，角色切換不是安全驗證。請勿輸入真實個資或病人資料。</p><div class="dashboard">'+Object.keys(schemas).map(p=>`<button class="metric" onclick="go('${p}')"><span class="navicon">${icons[p]||'·'}</span><span>${p}</span><strong>${rows(p).length}</strong><small>查看紀錄 →</small></button>`).join('')+'</div></section>';return}if(page==='系統設定'){ $('main').innerHTML=`<section><h2>加密備份與還原</h2><p>使用 AES-GCM 加密備份；本機瀏覽器資料仍為明文。</p><label>備份密碼</label><input id="pw" type="password"><p><button onclick="backup()">下載加密備份</button></p><input type="file" id="restore"><p><button onclick="restore()">還原加密備份</button></p></section>`;return}let fs=schemas[page].map(field),r=rows(page)[editing]||{}; $('main').innerHTML=`<section><h2>${page}</h2><small>新增或編輯紀錄；角色僅為介面模擬。</small><form id="form"><div class="grid">${fs.map((f,i)=>`<div><label>${f.name}</label>${f.opts?`<select id="f${i}">${f.opts.map(o=>`<option ${r[f.name]===o?'selected':''}>${o}</option>`).join('')}</select>`:f.t==='textarea'?`<textarea id="f${i}">${esc(r[f.name])}</textarea>`:f.t==='file'?`<input id="f${i}" type="file"><small>${esc(r[f.name]?.name||'')}</small>`:`<input id="f${i}" type="${f.t}" value="${esc(r[f.name])}">`}</div>`).join('')}</div><p><button class="primary" type="submit">${editing<0?'新增紀錄':'儲存修改'}</button> <button type="button" onclick="go(page)">取消</button></p></form></section><section><div class="listhead"><h2>紀錄列表</h2><button onclick="csv()">↓ 匯出 CSV</button></div><p class="intro">搜尋、查看及管理已建立的紀錄。</p><input id="q" placeholder="搜尋紀錄" oninput="listing()"><div id="list" class="scroll"></div></section>`; $('form').onsubmit=submit;listing()}
function listing(){let fs=schemas[page].map(field),q=$('q').value.toLowerCase();$('list').innerHTML='<table><thead><tr>'+fs.map(f=>`<th>${f.name}</th>`).join('')+'<th>操作</th></tr></thead><tbody>'+rows(page).map((r,i)=>JSON.stringify(r).toLowerCase().includes(q)?'<tr>'+fs.map(f=>`<td>${f.t==='file'&&r[f.name]?`<button onclick="attachment(${i},'${f.name}')">${esc(r[f.name].name)}</button>`:esc(r[f.name])}</td>`).join('')+`<td><button onclick="edit(${i})">編輯</button> <button onclick="del(${i})">刪除</button></td></tr>`:'').join('')+'</tbody></table>';if(!$('list').querySelector('tbody tr'))$('list').querySelector('tbody').innerHTML=`<tr><td class="empty" colspan="${fs.length+1}">${q?'沒有符合搜尋條件的紀錄':'目前尚無紀錄，請於上方新增。'}</td></tr>`}function edit(i){if(locked(rows(page)[i]))return alert('梯次已鎖定');editing=i;render()}function del(i){if(locked(rows(page)[i]))return alert('梯次已鎖定');if(confirm('確定刪除？')){rows(page).splice(i,1);save();render()}}async function submit(e){e.preventDefault();let r={...(rows(page)[editing]||{})};for(let [i,f] of schemas[page].map(field).entries()){let el=$('f'+i);if(f.t==='file'){let file=el.files[0];if(file){if(file.size>1024*1024)return alert('測試版單檔上限 1 MB');r[f.name]={name:file.name,data:await new Promise(ok=>{let fr=new FileReader;fr.onload=()=>ok(fr.result);fr.readAsDataURL(file)})}}}else r[f.name]=el.value}if(page!=='梯次管理'&&page!=='解鎖申請'&&locked(r))return alert('梯次已鎖定');if(page==='成績管理'){let w=['作業','技術','整體'];if(w.reduce((s,k)=>s+Number(r[k+'權重']),0)!==100)return alert('權重須合計100%');r['總成績']=w.reduce((s,k)=>s+Number(r[k+'分數'])*Number(r[k+'權重'])/100,0);alert('加權總成績：'+r['總成績'])}r.updated=new Date().toISOString();db[page]??=[];if(editing<0)db[page].push(r);else db[page][editing]=r;if(page==='解鎖申請'&&r['審核']==='核准'&&$('role').value==='管理員'){let b=rows('梯次管理').find(x=>x['梯次名稱']===r['梯次']);if(b)b['狀態']='待審核'}save();go(page)}function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function attachment(i,k){let f=rows(page)[i][k];let a=document.createElement('a');a.href=f.data;a.download=f.name;a.click()}function csv(){let keys=[...new Set(rows(page).flatMap(Object.keys))];let quote=x=>'"'+String(typeof x==='object'?x?.name||'':x??'').replace(/"/g,'""')+'"';download(page+'.csv','\ufeff'+[keys.map(quote).join(','),...rows(page).map(r=>keys.map(k=>quote(r[k])).join(','))].join('\r\n'),'text/csv')}async function key(p,s){let k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:250000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}async function backup(){try{let p=$('pw').value;if(p.length<12)return alert('密碼至少12字元');let s=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),c=await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(p,s),new TextEncoder().encode(JSON.stringify(db)));download('RT-LMS-backup.json',JSON.stringify({salt:[...s],iv:[...iv],data:[...new Uint8Array(c)]}),'application/json')}catch(e){alert('加密失敗：'+e.message)}}async function restore(){try{let f=$('restore').files[0],p=$('pw').value;if(!f)return alert('請選擇備份');let b=JSON.parse(await f.text()),s=new Uint8Array(b.salt),iv=new Uint8Array(b.iv),d=await crypto.subtle.decrypt({name:'AES-GCM',iv},await key(p,s),new Uint8Array(b.data));let restored=JSON.parse(new TextDecoder().decode(d));if(confirm('還原將覆蓋本機資料，確定？')){db=restored;save();go('首頁')}}catch(e){alert('還原失敗，請確認密碼及檔案')}}render();</script></html>
